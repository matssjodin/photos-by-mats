services:
  sjodinphotos:
    build: .
    image: sjodinphotos:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DATA_DIR: /app/data
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      APP_ORIGIN: ${APP_ORIGIN:-}
      NODE_ENV: production
    volumes:
      - sjodinphotos-data:/app/data

volumes:
  sjodinphotos-data:
