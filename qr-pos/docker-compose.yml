services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrpos
      POSTGRES_PASSWORD: qrpos
      POSTGRES_DB: qrpos
    ports:
      - "5432:5432"
    volumes:
      - qrpos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrpos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qrpos_pgdata:
